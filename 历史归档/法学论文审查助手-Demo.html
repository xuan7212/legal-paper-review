 12 12`,key:`d8bk6v`}]]};nn.node;var rn=w(nn),an=c(g(),1),on=`算法推荐场景下敏感个人信息处理的单独同意规则研究`,sn=[`随着算法推荐技术在电商、短视频和新闻资讯平台中的广泛应用，平台对用户个人信息的收集与分析日益深入。用户的浏览记录、停留时长、地理位置乃至健康状况，都可能被纳入推荐模型的训练与运行之中。在此背景下，如何通过同意规则约束平台的信息处理行为，成为个人信息保护领域的重要议题。本文以《个人信息保护法》第二十九条规定的单独同意规则为对象，讨论其在算法推荐场景中的认定标准与适用范围，并尝试回应平台合规实践中出现的若干争议。`,`依据《个人信息保护法》第二十八条，行踪轨迹、医疗健康等信息属于敏感个人信息，一旦泄露或者被非法使用，容易导致自然人的人格尊严受到侵害或者人身、财产安全受到危害。第二十九条进一步规定，处理敏感个人信息应当取得个人的单独同意。本文认为，单独同意是指个人针对特定的敏感个人信息处理活动，在一般性告知之外另行作出的、明确指向该处理活动的同意意思表示。这一界定强调同意对象的特定性与同意行为的独立性，二者缺一不可。需要说明的是，单独同意并不要求必须采用弹窗形式，关键在于同意行为能否与其他事项相区分。`,`从规范目的看，单独同意旨在通过提高同意的形式要求，促使个人对高风险处理活动进行审慎判断。与一般同意相比，单独同意不仅要求个人充分知情、自愿作出，还要求该意思表示不得与其他事项捆绑。因此，在算法推荐场景中，单独同意应当作为平台处理敏感个人信息的唯一合法性基础，平台不得援引其他事由绕开这一要求。这一立场有助于防止平台以概括授权的方式扩大信息处理范围，也与立法强化敏感个人信息保护的取向相一致。在立法目的的指引下，对单独同意的解释应当偏向保护个人的一方。`,`然而，实践中单独同意的实现方式并不统一。有学者指出，单独同意在实践中已沦为形式，用户往往在不了解具体处理目的的情况下点击同意。笔者在中国裁判文书网检索了三份涉及算法推荐与个人信息的判决，发现法院均未对平台是否取得单独同意进行实质审查，而是将审查重点放在平台是否履行了一般告知义务上。可见，我国司法实践普遍忽视了单独同意规则的独立价值。这种审查思路使单独同意与一般同意之间的界限趋于模糊，也削弱了该规则对平台的约束作用。`,`就同意的形式而言，部分平台在用户注册时提供隐私政策，并设置“我已阅读并同意”的勾选框。笔者认为，用户在注册时勾选隐私政策即可构成单独同意，只要隐私政策中以加粗方式标明了敏感个人信息的处理规则。这种做法兼顾了用户体验与合规成本，能够避免频繁弹窗对用户造成的干扰。此外，平台与第三方共享数据时，其应当承担相应的告知义务。当然，平台仍应确保隐私政策的内容真实、准确、完整。`,`值得注意的是，算法推荐服务往往与平台提供的核心服务紧密结合。在用户使用导航、外卖配送等服务时，平台可以无需取得单独同意，直接依据履行合同所必需处理用户的行踪轨迹信息。这说明，单独同意规则的适用范围应当结合具体服务类型予以确定，不宜对所有敏感个人信息处理活动作一刀切的要求。例如，外卖平台在配送过程中实时获取用户的位置信息，若每次均要求单独同意，将明显影响服务的正常提供。`,`在比较法上，欧盟《通用数据保护条例》对特殊类别个人数据的处理采取了原则禁止、例外允许的模式，其中明示同意是例外事由之一。借鉴这一经验，我国可以构建以风险等级为基础的分层同意机制：对于低风险的推荐处理，平台可以采用概括同意；对于涉及健康、行踪等敏感个人信息的推荐处理，平台可以取得用户的单独同意。因此，现行法已经确立了分层同意制度，平台应当据此调整其同意机制。当然，分层同意机制的具体标准仍有待监管部门通过配套规范加以细化。`,`综上所述，单独同意规则在算法推荐场景中面临形式化、适用范围不清和司法审查缺位等问题。为此，应当通过明确单独同意的认定标准、细化例外情形、加强司法审查等方式完善相关制度，从而实现对用户隐私权的全面保护，并推动算法推荐产业的健康发展。`],cn=sn.join(`
